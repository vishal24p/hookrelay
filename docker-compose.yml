name: hookrelay

services:

  api:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - HOOKRELAY_RUN_MIGRATIONS=${HOOKRELAY_RUN_MIGRATIONS:-true}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      - MAX_WEBHOOK_BODY_BYTES=${MAX_WEBHOOK_BODY_BYTES:-1048576}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - tunnel_data:/shared:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - public_net
      - local_net

  local_ingress:
    image: nginx:1.31.0-alpine
    ports:
      - "127.0.0.1:${HOOKRELAY_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - local_net

  public_ingress:
    image: nginx:1.31.0-alpine
    volumes:
      - ./nginx/public.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - public_net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - local_net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - local_net

  frontend:
    build: ./frontend
    depends_on:
      - api
    networks:
      - local_net

  tunnel:
    build: ./tunnel
    volumes:
      - tunnel_data:/shared
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
      - TUNNEL_HOSTNAME=${TUNNEL_HOSTNAME:-}
    depends_on:
      - public_ingress
    restart: unless-stopped
    networks:
      - public_net

volumes:
  postgres_data:
    name: hookrelay_postgres_data
  redis_data:
    name: hookrelay_redis_data
  tunnel_data:
    name: hookrelay_tunnel_data

networks:
  public_net:
  local_net:
