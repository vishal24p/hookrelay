services:

  api:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://webhookuser:webhookpass@postgres:5432/webhookdb
      - REDIS_URL=redis://redis:6379
      - GITHUB_WEBHOOK_TOKEN=${GITHUB_WEBHOOK_TOKEN:-}
      - GITHUB_WEBHOOK_OWNER=${GITHUB_WEBHOOK_OWNER:-}
      - GITHUB_WEBHOOK_REPO=${GITHUB_WEBHOOK_REPO:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_WEBHOOK_SESSION_ID=${GITHUB_WEBHOOK_SESSION_ID:-github}
      - GITHUB_WEBHOOK_EVENTS=${GITHUB_WEBHOOK_EVENTS:-push,ping}
      - GITHUB_WEBHOOK_AUTOCONFIG=${GITHUB_WEBHOOK_AUTOCONFIG:-true}
      - GITHUB_WEBHOOK_POLL_INTERVAL_SECONDS=${GITHUB_WEBHOOK_POLL_INTERVAL_SECONDS:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - tunnel_data:/shared:ro
    networks:
      - public_net
      - local_net

  local_ingress:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - local_net

  public_ingress:
    image: nginx:alpine
    volumes:
      - ./nginx/public.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - public_net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: webhookuser
      POSTGRES_PASSWORD: webhookpass
      POSTGRES_DB: webhookdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webhookuser -d webhookdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - local_net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - local_net

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - local_net

  tunnel:
    build: ./tunnel
    volumes:
      - tunnel_data:/shared
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
      - TUNNEL_HOSTNAME=${TUNNEL_HOSTNAME:-}
    depends_on:
      - public_ingress
    restart: unless-stopped
    networks:
      - public_net

volumes:
  postgres_data:
  tunnel_data:

networks:
  public_net:
  local_net:
