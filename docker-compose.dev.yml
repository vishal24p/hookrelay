services:

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-webhookuser}:${POSTGRES_PASSWORD:-webhookpass}@postgres:5432/${POSTGRES_DB:-webhookdb}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      - MAX_WEBHOOK_BODY_BYTES=${MAX_WEBHOOK_BODY_BYTES:-1048576}
    volumes:
      - ./backend:/app
      - tunnel_data:/shared:ro

  frontend:
    command: ["npm", "run", "dev:container"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
